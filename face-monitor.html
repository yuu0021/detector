<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC 端：MQTT 人臉辨識監控</title>
<style>
  :root { --bg:#0e1322; --panel:#171e33; --card:#1d2640; --line:#2b3658; --ink:#eaf0ff; --dim:#93a0c4; --acc:#4f7cff; --ok:#3ddc57; --bad:#ff4d4d; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  .sub { color:var(--dim); margin:0 0 16px; font-size:.95rem; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  .ctl { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--dim); }
  #topic { width:min(420px,80vw); } #dev { width:180px; }
  input { padding:10px; font-size:.95rem; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { padding:10px 16px; font-size:.95rem; border:0; border-radius:8px; background:var(--acc); color:#fff; font-weight:600; }
  button.gray { background:#2b3658; }
  button:focus-visible, input:focus-visible { outline:3px solid #9db6ff; outline-offset:2px; }
  #st { margin:10px 0 2px; color:#8fb0ff; font-size:.95rem; }
  .note { color:var(--dim); font-size:.78rem; }
  #alert { display:none; margin-bottom:12px; padding:12px 16px; border-radius:10px; background:#5a1a1f; color:#ffb4b4; font-weight:700; border:1px solid var(--bad); animation:blink 1s infinite; }
  #alert.on { display:block; }
  @keyframes blink { 50% { background:#7a2229; } }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:12px; }
  .stat { background:var(--card); border-radius:10px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:1.5rem; }
  .stat span { font-size:.78rem; color:var(--dim); }
  .main { display:flex; gap:16px; flex-wrap:wrap; }
  #stage { flex:2 1 420px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; align-self:flex-start; }
  canvas { width:100%; display:block;
    background-image:linear-gradient(#1b2340 1px,transparent 1px),linear-gradient(90deg,#1b2340 1px,transparent 1px); background-size:48px 48px; }
  #side { flex:1 1 260px; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; margin-bottom:12px; }
  th, td { text-align:left; padding:6px 4px; border-bottom:1px solid #26323c; }
  th { color:var(--dim); font-weight:500; }
  .k { color:var(--ok); } .u { color:var(--bad); }
  #log { max-height:170px; overflow:auto; font-size:.85rem; color:var(--dim); margin:0; padding-left:18px; }
  @media (max-width:640px){ .stats{ grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖥️ PC 端：MQTT 人臉辨識監控</h1>
  <p class="sub">訂閱手機的人臉辨識結果，在黑色 Canvas 重建外框與姓名；不接收、不顯示照片。</p>

  <div class="panel">
    <div class="ctl">
      <label>MQTT Topic<input id="topic" value="nutc/im/s1411331002/face"></label>
      <label>裝置 ID 過濾（留空接收所有）<input id="dev" value="phone01"></label>
      <button id="go">▶ 連線訂閱</button>
      <button id="stop" class="gray">■ 中斷</button>
    </div>
    <div id="st">尚未連線</div>
    <div class="note">Broker：wss://broker.hivemq.com:8884/mqtt ｜ 綠色＝已登錄人員，紅色＝陌生人。</div>
  </div>

  <div id="alert" role="alert">⚠ 偵測到陌生人！</div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="sAll">0</b><span>目前人數</span></div>
      <div class="stat"><b id="sK" class="k">0</b><span>已登錄</span></div>
      <div class="stat"><b id="sU" class="u">0</b><span>陌生人</span></div>
      <div class="stat"><b id="sMsg">0</b><span>累計訊息</span></div>
      <div class="stat"><b id="sAge">-</b><span>距最近訊息（秒）</span></div>
    </div>
    <div class="main">
      <div id="stage"><canvas id="cv" width="640" height="480"></canvas></div>
      <div id="side">
        <table><thead><tr><th>身分</th><th>距離</th><th>外框 x,y,w,h</th></tr></thead><tbody id="rows"></tbody></table>
        <b>事件紀錄</b>
        <ol id="log" reversed></ol>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let client = null, topic = '', msgs = 0, last = 0;
const seen = {};            // 名字 -> 最後看到的時間（含 '陌生人'）

function log(t){ const li = document.createElement('li'); li.textContent = `${new Date().toLocaleTimeString()}　${t}`; $('log').prepend(li); }

function disconnect(m){ if (client) { client.end(true); client = null; } $('st').textContent = m || '已中斷'; }
function connect(){
  disconnect('連線中…');
  topic = $('topic').value.trim();
  client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId:'face_pc_' + Math.random().toString(16).slice(2, 10), reconnectPeriod:2000 });
  client.on('connect', () => client.subscribe(topic, e => $('st').textContent = e ? '訂閱失敗：' + e.message : `已訂閱 ${topic}，等待手機訊息…`));
  client.on('close', () => { if (client) $('st').textContent = '連線中斷，重試中…'; });
  client.on('error', e => $('st').textContent = '錯誤：' + e.message);
  client.on('message', (t, buf) => {
    try {
      const d = JSON.parse(buf.toString());
      const f = $('dev').value.trim();
      if (f && d.device !== f) return;
      msgs++; last = Date.now(); render(d);
    } catch (e) { console.error(e); }
  });
}

function render(d){
  cv.width = d.w; cv.height = d.h; ctx.clearRect(0, 0, d.w, d.h);
  const fs = Math.max(15, Math.round(d.w / 28));
  ctx.font = `700 ${fs}px system-ui, "Noto Sans TC", sans-serif`; ctx.textBaseline = 'top'; ctx.lineWidth = Math.max(3, fs / 5);
  const rows = [];
  for (const o of d.faces) {
    const [x, y, w, h] = o.bbox, c = o.known ? '#3ddc57' : '#ff4d4d';
    const label = o.name + (o.distance != null ? ' ' + o.distance.toFixed(2) : '');
    ctx.strokeStyle = c; ctx.strokeRect(x, y, w, h);
    const tw = ctx.measureText(label).width + 12, th = fs + 10, ty = y - th >= 0 ? y - th : y + h;
    ctx.fillStyle = c; ctx.fillRect(x, ty, tw, th); ctx.fillStyle = '#000'; ctx.fillText(label, x + 6, ty + 5);
    rows.push(`<tr><td class="${o.known ? 'k' : 'u'}">${o.name}</td><td>${o.distance ?? '-'}</td><td>${o.bbox.join(', ')}</td></tr>`);
    const key = o.known ? o.name : '陌生人';
    if (!(key in seen)) log(key === '陌生人' ? '⚠ 偵測到陌生人' : `✓ ${key} 進入畫面`);
    seen[key] = Date.now();
  }
  $('rows').innerHTML = rows.join('');
  $('sAll').textContent = d.faces.length; $('sK').textContent = d.known; $('sU').textContent = d.unknown; $('sMsg').textContent = msgs;
  $('alert').classList.toggle('on', d.unknown > 0);
  $('st').textContent = `接收中 ${topic}`;
}

setInterval(() => {
  const now = Date.now();
  $('sAge').textContent = last ? ((now - last) / 1000).toFixed(1) : '-';
  for (const k of Object.keys(seen)) if (now - seen[k] > 2500) { log(k === '陌生人' ? '陌生人已離開畫面' : `${k} 離開畫面`); delete seen[k]; }
}, 300);

$('go').onclick = connect; $('stop').onclick = () => disconnect();
connect();
</script>
</body>
</html>
