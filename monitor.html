<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC MQTT 物件外框即時監控</title>
<style>
  :root { --bg:#0e1322; --panel:#171e33; --card:#1d2640; --line:#2b3658; --ink:#eaf0ff; --dim:#93a0c4; --acc:#4f7cff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 6px; }
  .sub { color:var(--dim); margin:0 0 16px; font-size:.95rem; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  .ctl { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .ctl label { display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--dim); }
  #topic { width:min(440px,80vw); } #dev { width:200px; }
  input { padding:10px; font-size:.95rem; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { padding:10px 16px; font-size:.95rem; border:0; border-radius:8px; background:var(--acc); color:#fff; font-weight:600; }
  button.gray { background:#2b3658; color:var(--ink); }
  button:focus-visible, input:focus-visible { outline:3px solid #9db6ff; outline-offset:2px; }
  #st { margin:10px 0 2px; color:#8fb0ff; font-size:.95rem; }
  .note { color:var(--dim); font-size:.78rem; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
  .stat { background:var(--card); border-radius:10px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:1.5rem; }
  .stat span { font-size:.78rem; color:var(--dim); }
  #stage { border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#000; }
  canvas { width:100%; display:block; background-color:#000;
    background-image:linear-gradient(#1b2340 1px,transparent 1px),linear-gradient(90deg,#1b2340 1px,transparent 1px); background-size:48px 48px; }
  @media (max-width:560px){ .stats{ grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖥️ PC MQTT 物件外框監控</h1>
  <p class="sub">訂閱手機 COCO-SSD 偵測資料，在黑色 Canvas 上重建外框；不接收、不顯示照片。</p>

  <div class="panel">
    <div class="ctl">
      <label>MQTT Topic<input id="topic" value="nutc/im/s1411331002/objects"></label>
      <label>裝置 ID 過濾（留空接收所有）<input id="dev" value="phone01"></label>
      <button id="go">▶ 連線訂閱</button>
      <button id="stop" class="gray">■ 中斷</button>
    </div>
    <div id="st">尚未連線</div>
    <div class="note">Broker：wss://broker.hivemq.com:8884/mqtt ｜ 若多支手機使用同一 Topic，可用裝置 ID 過濾；留空則接收所有裝置，畫面呈現最新收到的一支手機。</div>
  </div>

  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="sObj">0</b><span>目前物件數</span></div>
      <div class="stat"><b id="sKind">0</b><span>種類數</span></div>
      <div class="stat"><b id="sMsg">0</b><span>累計訊息</span></div>
      <div class="stat"><b id="sAge">-</b><span>距最近訊息（秒）</span></div>
    </div>
    <div id="stage"><canvas id="cv" width="640" height="480"></canvas></div>
    <p id="list" class="note" style="margin:10px 0 0"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let client = null, topic = '', msgs = 0, last = 0;
const color = n => { let h = 0; for (const c of n) h = (h*31 + c.charCodeAt(0)) % 360; return `hsl(${h} 90% 62%)`; };

function disconnect(msg){
  if (client) { client.end(true); client = null; }
  $('st').textContent = msg || '已中斷';
}
function connect(){
  disconnect('連線中…');
  topic = $('topic').value.trim();
  client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId: 'pc_' + Math.random().toString(16).slice(2, 10), reconnectPeriod: 2000 });
  client.on('connect', () => client.subscribe(topic, err => {
    $('st').textContent = err ? '訂閱失敗：' + err.message : `已訂閱 ${topic}，等待手機訊息…`;
  }));
  client.on('close', () => { if (client) $('st').textContent = '連線中斷，重試中…'; });
  client.on('error', e => $('st').textContent = '錯誤：' + e.message);
  client.on('message', (t, buf) => {
    try {
      const d = JSON.parse(buf.toString());
      const f = $('dev').value.trim();
      if (f && d.device !== f) return;
      msgs++; last = Date.now(); render(d);
    } catch (e) { console.error(e); }
  });
}

function render(d){
  cv.width = d.w; cv.height = d.h;
  ctx.clearRect(0, 0, d.w, d.h);
  const fs = Math.max(14, Math.round(d.w / 32));
  ctx.font = `600 ${fs}px system-ui, "Noto Sans TC", sans-serif`;
  ctx.textBaseline = 'top'; ctx.lineWidth = Math.max(2, fs / 6);
  for (const o of d.objects) {
    const [x, y, w, h] = o.bbox, c = color(o.name);
    const label = `${o.zh} (${o.name}) ${Math.round(o.score * 100)}%`;
    ctx.strokeStyle = c; ctx.strokeRect(x, y, w, h);
    const tw = ctx.measureText(label).width + 10, th = fs + 8, ty = y - th >= 0 ? y - th : y;
    ctx.fillStyle = c; ctx.fillRect(x, ty, tw, th);
    ctx.fillStyle = '#000'; ctx.fillText(label, x + 5, ty + 4);
  }
  const kinds = Object.keys(d.summary || {});
  $('sObj').textContent = d.count; $('sKind').textContent = kinds.length; $('sMsg').textContent = msgs;
  $('list').textContent = kinds.map(k => `${(d.objects.find(o => o.name === k) || {}).zh || k} × ${d.summary[k]}`).join('　');
  $('st').textContent = `接收中 ${topic}`;
}

setInterval(() => { $('sAge').textContent = last ? ((Date.now() - last) / 1000).toFixed(1) : '-'; }, 200);
$('go').onclick = connect; $('stop').onclick = () => disconnect();
connect();
</script>
</body>
</html>
