<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手機端：車牌辨識 + MQTT 發布</title>
<style>
  :root { --bg:#10151a; --panel:#1a222a; --line:#2b3844; --ink:#eef3f6; --dim:#8fa1ad; --acc:#3ddc97; --warn:#ffc233; }
  * { box-sizing:border-box; }
  body { margin:0 auto; max-width:720px; padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px); background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  h1 { font-size:1.15rem; margin:14px 0 6px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  #status { color:var(--dim); font-size:.9rem; margin-bottom:10px; min-height:1.3em; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  #stage { position:relative; width:100%; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:4/3; margin-bottom:10px; }
  #video, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  button { flex:1 1 40%; padding:12px; font-size:1rem; border:0; border-radius:8px; background:#2b3844; color:var(--ink); }
  button.primary { background:var(--acc); color:#06241a; font-weight:600; }
  button:disabled { opacity:.4; }
  button:focus-visible, input:focus-visible { outline:3px solid #9fe9c8; outline-offset:2px; }
  input[type=file] { width:100%; color:var(--dim); margin:6px 0; }
  label.chk { display:flex; gap:8px; align-items:center; font-size:.95rem; margin:6px 0; }
  .hint { color:var(--dim); font-size:.82rem; margin:4px 0; }
  #plate { font-size:2.2rem; font-weight:800; letter-spacing:.06em; text-align:center; padding:14px 8px; border-radius:10px; background:#0d1318; border:2px solid var(--line); font-family:ui-monospace,Menlo,Consolas,monospace; }
  #plate.ok { border-color:var(--acc); color:var(--acc); }
  #live { text-align:center; color:var(--dim); font-size:.9rem; margin:8px 0; min-height:1.3em; }
  #crop { width:100%; max-height:110px; object-fit:contain; background:#fff; border-radius:6px; display:block; }
  #log { margin:0; padding-left:18px; font-size:.88rem; color:var(--dim); max-height:150px; overflow:auto; }
</style>
</head>
<body>
<h1>手機端：台灣車牌辨識 + MQTT 發布</h1>
<div id="status">正在載入 OCR 引擎…</div>

<div class="card">
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="overlay"></canvas>
  </div>
  <div class="row">
    <button id="startBtn" class="primary" disabled>啟動相機</button>
    <button id="stopBtn" disabled>停止</button>
    <button id="flipBtn" disabled>切換前／後鏡頭</button>
  </div>
  <label class="chk"><input type="checkbox" id="roiOn" checked>只在中央虛線框內找車牌（減少誤判）</label>
  <div class="hint">把車牌對準虛線框、正面拍攝、距離約 1～3 公尺。多個車牌同時出現時，只會挑最大的一個做辨識。</div>
  <label class="chk" style="display:block">MQTT Topic<input id="topic" type="text" value="nutc/im/s1411331002/plate" style="width:100%;padding:10px;font-size:1rem;border-radius:8px;border:1px solid #33414c;background:#10151a;color:#eef3f6;margin-top:4px"></label>
  <label class="chk" style="display:block">裝置 ID<input id="dev" type="text" value="phone01" style="width:100%;padding:10px;font-size:1rem;border-radius:8px;border:1px solid #33414c;background:#10151a;color:#eef3f6;margin-top:4px"></label>
  <div id="mq" class="hint">MQTT：未連線（只傳車牌文字與外框，不傳照片）</div>
</div>

<div class="card">
  <h2>辨識結果</h2>
  <div id="plate">— — —</div>
  <div id="live"></div>
  <img id="crop" alt="送進 OCR 的車牌影像" hidden>
  <div class="row" style="margin-top:10px">
    <button id="copyBtn" disabled>複製車牌</button>
    <button id="resetBtn">重置投票</button>
  </div>
  <div class="hint">連續多次讀到相同結果才會「確認」（綠色），避免單張影像誤判。</div>
</div>

<div class="card">
  <h2>用照片測試</h2>
  <input type="file" id="photo" accept="image/*">
  <div class="hint">沒有車可以拍時，可選一張有車牌的照片測試整條流程。</div>
</div>

<div class="card"><h2>確認紀錄</h2><ol id="log"></ol></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently:true });
const cc = document.createElement('canvas'), cctx = cc.getContext('2d', { willReadFrequently:true });
let worker = null, stream = null, running = false, facing = 'environment', ocrBusy = false;
let votes = [], confirmed = '', lastDetect = 0, lastOcr = 0, liveText = '', raf = 0;
const TW = 320, ROI = { x:0.12, y:0.25, w:0.76, h:0.5 };

/* ---------- 1. 車牌定位（垂直邊緣密度 + 連通區域） ---------- */
function locate(src, sw, sh, useRoi){
  const w = TW, h = Math.round(sh * TW / sw);
  work.width = w; work.height = h; wctx.drawImage(src, 0, 0, w, h);
  const px = wctx.getImageData(0, 0, w, h).data, n = w * h, g = new Uint8Array(n);
  for (let i = 0; i < n; i++) g[i] = (px[4*i]*77 + px[4*i+1]*150 + px[4*i+2]*29) >> 8;
  const gx = new Uint8Array(n); let sum = 0;
  for (let y = 0; y < h; y++) for (let x = 1; x < w - 1; x++) { const i = y*w + x, d = Math.abs(g[i+1] - g[i-1]); gx[i] = d; sum += d; }
  const T = Math.max(35, 2 * sum / n), e = new Uint8Array(n);
  for (let i = 0; i < n; i++) e[i] = gx[i] > T ? 1 : 0;
  // 水平方向：視窗內邊緣夠密就連起來
  const m = new Uint8Array(n), R = 7;
  for (let y = 0; y < h; y++) {
    const p = new Uint16Array(w + 1);
    for (let x = 0; x < w; x++) p[x+1] = p[x] + e[y*w + x];
    for (let x = 0; x < w; x++) m[y*w + x] = (p[Math.min(w, x+R+1)] - p[Math.max(0, x-R)]) >= 4 ? 1 : 0;
  }
  // 垂直方向：要求上下也有連續
  const m2 = new Uint8Array(n), V = 2;
  for (let x = 0; x < w; x++) {
    const p = new Uint16Array(h + 1);
    for (let y = 0; y < h; y++) p[y+1] = p[y] + m[y*w + x];
    for (let y = 0; y < h; y++) m2[y*w + x] = (p[Math.min(h, y+V+1)] - p[Math.max(0, y-V)]) >= 3 ? 1 : 0;
  }
  // 連通區域
  const seen = new Uint8Array(n), stack = new Int32Array(n), cands = [], s = sw / w;
  for (let i0 = 0; i0 < n; i0++) {
    if (!m2[i0] || seen[i0]) continue;
    let sp = 0, cnt = 0, x0 = w, x1 = 0, y0 = h, y1 = 0;
    stack[sp++] = i0; seen[i0] = 1;
    while (sp) {
      const i = stack[--sp], x = i % w, y = (i / w) | 0; cnt++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && m2[i-1] && !seen[i-1]) { seen[i-1] = 1; stack[sp++] = i-1; }
      if (x < w-1 && m2[i+1] && !seen[i+1]) { seen[i+1] = 1; stack[sp++] = i+1; }
      if (y > 0 && m2[i-w] && !seen[i-w]) { seen[i-w] = 1; stack[sp++] = i-w; }
      if (y < h-1 && m2[i+w] && !seen[i+w]) { seen[i+w] = 1; stack[sp++] = i+w; }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, ar = bw / bh, fill = cnt / (bw * bh);
    if (bw < 28 || bh < 9 || bw > w * 0.9 || ar < 1.8 || ar > 5.5 || fill < 0.5) continue;
    const b = { x:x0*s, y:y0*s, w:bw*s, h:bh*s };
    if (useRoi) {
      const cx = (b.x + b.w/2) / sw, cy = (b.y + b.h/2) / sh;
      if (cx < ROI.x || cx > ROI.x + ROI.w || cy < ROI.y || cy > ROI.y + ROI.h) continue;
    }
    cands.push(b);
  }
  cands.sort((a, b) => b.w * b.h - a.w * a.h);      // 最大的排第一
  return cands;
}

/* ---------- 2. 裁切 + 二值化（給 OCR） ---------- */
function cropForOCR(src, sw, sh, b){
  const px = b.w * 0.08, py = b.h * 0.25;
  const x = Math.max(0, b.x - px), y = Math.max(0, b.y - py);
  const w = Math.min(sw - x, b.w + 2*px), h = Math.min(sh - y, b.h + 2*py);
  const H = 96, W = Math.max(40, Math.round(w * H / h));
  cc.width = W + 24; cc.height = H + 24;
  cctx.fillStyle = '#fff'; cctx.fillRect(0, 0, cc.width, cc.height);
  cctx.drawImage(src, x, y, w, h, 12, 12, W, H);
  const img = cctx.getImageData(0, 0, cc.width, cc.height), d = img.data, n = cc.width * cc.height;
  const gray = new Uint8Array(n), hist = new Array(256).fill(0);
  for (let i = 0; i < n; i++) { gray[i] = (d[4*i]*77 + d[4*i+1]*150 + d[4*i+2]*29) >> 8; hist[gray[i]]++; }
  let sumAll = 0; for (let t = 0; t < 256; t++) sumAll += t * hist[t];
  let wB = 0, sumB = 0, best = 0, th = 128;                       // Otsu
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (!wB) continue; const wF = n - wB; if (!wF) break;
    sumB += t * hist[t]; const mB = sumB / wB, mF = (sumAll - sumB) / wF, v = wB * wF * (mB - mF) ** 2;
    if (v > best) { best = v; th = t; }
  }
  let white = 0; for (let i = 0; i < n; i++) if (gray[i] > th) white++;
  const inv = white < n * 0.5;                                    // 讓背景變白、文字變黑
  for (let i = 0; i < n; i++) { let v = gray[i] > th ? 255 : 0; if (inv) v = 255 - v; d[4*i] = d[4*i+1] = d[4*i+2] = v; d[4*i+3] = 255; }
  cctx.putImageData(img, 0, 0);
  return cc;
}

/* ---------- 3. 台灣車牌規則校正 ---------- */
const PATS = [
  ['LLLDDDD', s => s.slice(0,3) + '-' + s.slice(3)],   // 新式汽車 ABC-1234
  ['DDDDLL',  s => s.slice(0,4) + '-' + s.slice(4)],   // 舊式汽車 1234-AB
  ['LLDDDD',  s => s.slice(0,2) + '-' + s.slice(2)],   // 舊式汽車 AB-1234
  ['LLLDDD',  s => s.slice(0,3) + '-' + s.slice(3)],   // 機車 ABC-123
  ['DDDLLL',  s => s.slice(0,3) + '-' + s.slice(3)]    // 舊式機車 123-ABC
];
const toL = { '0':'D', '1':'L', '2':'Z', '4':'A', '5':'S', '6':'G', '7':'T', '8':'B' };
const toD = { O:'0', Q:'0', D:'0', I:'1', L:'1', Z:'2', A:'4', S:'5', G:'6', T:'7', B:'8' };
const okLetter = ch => /[A-HJ-NP-Z]/.test(ch);            // 車牌英文字母不使用 I、O
function fixPlate(raw){
  let best = null;
  for (const [pat, fmt] of PATS) {
    const L = pat.length;
    for (let st = 0; st + L <= raw.length; st++) {
      let out = '', cost = (raw.length - L) * 1.5, ok = true;
      for (let i = 0; i < L && ok; i++) {
        const ch = raw[st + i];
        if (pat[i] === 'L') { if (okLetter(ch)) out += ch; else if (toL[ch]) { out += toL[ch]; cost++; } else ok = false; }
        else { if (/\d/.test(ch)) out += ch; else if (toD[ch]) { out += toD[ch]; cost++; } else ok = false; }
      }
      if (ok && cost < 3 && (!best || cost < best.cost)) best = { text:fmt(out), cost };
    }
  }
  return best;
}

/* ---------- 4. OCR + 多幀投票 ---------- */
async function initOCR(){
  try {
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({ tessedit_char_whitelist:'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789', tessedit_pageseg_mode:'7' });
    $('status').textContent = 'OCR 已就緒。'; $('startBtn').disabled = false;
  } catch (e) { $('status').textContent = 'OCR 載入失敗：' + e.message; }
}
async function readPlate(src, sw, sh, b){
  const c = cropForOCR(src, sw, sh, b);
  $('crop').src = c.toDataURL('image/png'); $('crop').hidden = false;
  const { data } = await worker.recognize(c);
  const raw = data.text.toUpperCase().replace(/[^A-Z0-9]/g, '');
  const fixed = raw ? fixPlate(raw) : null;
  liveText = raw ? `原始：${raw} → ${fixed ? fixed.text : '不符合車牌格式'}` : '讀不到文字';
  $('live').textContent = liveText;
  return fixed ? fixed.text : null;
}
function vote(t){
  if (!t) return;
  votes.push(t); if (votes.length > 8) votes.shift();
  const c = {}; votes.forEach(v => c[v] = (c[v] || 0) + 1);
  const [top, n] = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  $('plate').textContent = top;
  if (n >= 3) setConfirmed(top); else { $('plate').className = ''; $('live').textContent = liveText + `（票數 ${n}/3）`; }
}
function setConfirmed(t){
  $('plate').textContent = t; $('plate').className = 'ok'; $('copyBtn').disabled = false;
  if (t !== confirmed) { confirmed = t; const li = document.createElement('li'); li.textContent = `${new Date().toLocaleTimeString()}　${t}`; $('log').prepend(li); }
}
function resetVotes(){ votes = []; confirmed = ''; $('plate').textContent = '— — —'; $('plate').className = ''; $('live').textContent = ''; $('copyBtn').disabled = true; }

/* ---------- 相機與主迴圈 ---------- */
async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  video.srcObject = null; await new Promise(r => setTimeout(r, 300));
  const base = { width:{ ideal:1280 }, height:{ ideal:720 } };
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ ...base, facingMode:{ exact:facing } } }); }
  catch (e) { stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ ...base, facingMode:{ ideal:facing } } }); }
  video.srcObject = stream; await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  $('stage').style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
}
async function start(){
  if (running) return;
  try {
    await openCamera(); running = true; mqttConnect(); $('startBtn').disabled = true; $('stopBtn').disabled = $('flipBtn').disabled = false;
    $('status').textContent = '辨識中…'; loop();
  } catch (e) { $('status').textContent = '無法開啟相機：' + e.message + '（需 HTTPS 並允許相機權限）'; }
}
function stop(){
  running = false; cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null; ctx.clearRect(0, 0, canvas.width, canvas.height);
  publish(null, canvas.width, canvas.height, true);
  $('startBtn').disabled = false; $('stopBtn').disabled = $('flipBtn').disabled = true; $('status').textContent = '已停止。';
}
async function flip(){ facing = facing === 'environment' ? 'user' : 'environment'; if (running) try { await openCamera(); } catch (e) { $('status').textContent = '切換失敗：' + e.message; } }

function drawBoxes(cands, useRoi){
  const W = canvas.width, H = canvas.height, fs = Math.max(14, Math.round(W / 34));
  ctx.lineWidth = Math.max(2, fs / 6); ctx.font = `700 ${fs}px system-ui, "Noto Sans TC", sans-serif`; ctx.textBaseline = 'top';
  if (useRoi) { ctx.setLineDash([12, 8]); ctx.strokeStyle = '#ffffffaa'; ctx.strokeRect(ROI.x*W, ROI.y*H, ROI.w*W, ROI.h*H); ctx.setLineDash([]); }
  cands.forEach((b, i) => {
    ctx.strokeStyle = i === 0 ? '#3ddc57' : '#ffc233'; ctx.strokeRect(b.x, b.y, b.w, b.h);
    if (i === 0) { const t = confirmed || '最大車牌'; const tw = ctx.measureText(t).width + 12, ty = Math.max(0, b.y - fs - 10);
      ctx.fillStyle = '#3ddc57'; ctx.fillRect(b.x, ty, tw, fs + 10); ctx.fillStyle = '#000'; ctx.fillText(t, b.x + 6, ty + 5); }
  });
}
function loop(){
  if (!running) return;
  const now = performance.now();
  if (video.readyState >= 2 && now - lastDetect > 120) {
    lastDetect = now;
    const sw = video.videoWidth, sh = video.videoHeight, useRoi = $('roiOn').checked;
    const cands = locate(video, sw, sh, useRoi);
    ctx.clearRect(0, 0, sw, sh); drawBoxes(cands, useRoi); publish(cands[0], sw, sh);
    if (cands.length && !ocrBusy && worker && now - lastOcr > 500) {
      ocrBusy = true; lastOcr = now;
      readPlate(video, sw, sh, cands[0]).then(vote).catch(console.error).finally(() => ocrBusy = false);
    }
  }
  raf = requestAnimationFrame(loop);
}

/* ---------- MQTT ---------- */
let mq = null, lastPub = 0;
function mqttConnect(){
  if (mq) return;
  mq = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId:'plate_phone_' + Math.random().toString(16).slice(2, 10), reconnectPeriod:2000 });
  mq.on('connect', () => $('mq').textContent = 'MQTT：已連線 broker.hivemq.com');
  mq.on('reconnect', () => $('mq').textContent = 'MQTT：重新連線中…');
  mq.on('error', e => $('mq').textContent = 'MQTT 錯誤：' + e.message);
}
function publish(best, w, h, force){
  if (!mq || !mq.connected) return;
  const now = Date.now(); if (!force && now - lastPub < 300) return; lastPub = now;
  mq.publish($('topic').value.trim(), JSON.stringify({
    device:$('dev').value.trim(), ts:now, w, h,
    bbox: best ? [best.x, best.y, best.w, best.h].map(Math.round) : null,
    plate: confirmed, live: ($('plate').textContent || '').replace('— — —', '')
  }));
}

/* ---------- 照片測試 ---------- */
$('photo').onchange = async e => {
  const f = e.target.files[0]; if (!f || !worker) return;
  if (running) stop();
  $('status').textContent = '處理照片中…';
  const img = await createImageBitmap(f), k = Math.min(1, 1280 / img.width);
  const ph = document.createElement('canvas'); ph.width = Math.round(img.width * k); ph.height = Math.round(img.height * k);
  ph.getContext('2d').drawImage(img, 0, 0, ph.width, ph.height);
  canvas.width = ph.width; canvas.height = ph.height; $('stage').style.aspectRatio = `${ph.width} / ${ph.height}`;
  const cands = locate(ph, ph.width, ph.height, false);
  ctx.clearRect(0, 0, ph.width, ph.height); ctx.drawImage(ph, 0, 0); drawBoxes(cands, false);
  if (!cands.length) { $('status').textContent = '照片中找不到車牌位置，請換一張更清楚、車牌較大的照片。'; return; }
  resetVotes();
  const t = await readPlate(ph, ph.width, ph.height, cands[0]);
  if (t) { setConfirmed(t); $('status').textContent = `找到 ${cands.length} 個候選區域，已挑最大的辨識。`; }
  else $('status').textContent = '有找到車牌位置，但文字讀不出符合格式的結果。';
  ctx.clearRect(0, 0, ph.width, ph.height); ctx.drawImage(ph, 0, 0); drawBoxes(cands, false);
};

$('startBtn').onclick = start; $('stopBtn').onclick = stop; $('flipBtn').onclick = flip; $('resetBtn').onclick = resetVotes;
$('copyBtn').onclick = () => navigator.clipboard && navigator.clipboard.writeText(confirmed).then(() => $('status').textContent = `已複製 ${confirmed}`);
initOCR();
</script>
</body>
</html>
