<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手機端：AI 自動柵欄</title>
<style>
  :root { --bg:#10151a; --panel:#1a222a; --ink:#eef3f6; --dim:#8fa1ad; --acc:#3ddc97; --warn:#ffb020; }
  * { box-sizing:border-box; }
  body { margin:0; padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px); max-width:720px; margin:0 auto; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans TC","PingFang TC",sans-serif; }
  h1 { font-size:1.1rem; margin:14px 0 6px; }
  #status { color:var(--dim); font-size:.9rem; margin-bottom:8px; }
  #stage { position:relative; width:100%; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
  #video, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #overlay { touch-action:none; }
  #gate { margin:10px 0; padding:12px; border-radius:10px; background:var(--panel); font-size:1.05rem; }
  #gate.on { background:#14462f; }
  .hint { color:var(--dim); font-size:.85rem; margin:4px 0 10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  button { flex:1 1 40%; padding:12px; font-size:1rem; border:0; border-radius:8px; background:var(--panel); color:var(--ink); }
  button.primary { background:var(--acc); color:#06241a; font-weight:600; }
  button:disabled { opacity:.4; }
  input[type=text] { width:100%; padding:10px; font-size:1rem; border-radius:8px; border:1px solid #33414c; background:var(--panel); color:var(--ink); }
  input[type=range] { width:100%; accent-color:var(--acc); }
  label { display:block; font-size:.95rem; margin:8px 0; }
</style>
</head>
<body>
<h1>手機端：AI 自動柵欄</h1>
<div id="status">正在載入 AI 模型…</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>
<div class="hint">在畫面上用手指拖曳，可重新框出「指定區域」(橘色虛線)。</div>
<div id="gate">區域內汽車：否　→　發布 0</div>

<label>MQTT Topic（柵欄控制）
  <input id="topic" type="text" value="nutc/im/s1411331002/gate">
</label>
<div id="mq" class="hint">MQTT：未連線</div>
<label>最低信心分數：<b id="thVal">50</b>%
  <input type="range" id="th" min="10" max="95" step="5" value="50">
</label>

<div class="row">
  <button id="startBtn" class="primary" disabled>啟動</button>
  <button id="stopBtn" disabled>停止</button>
  <button id="flipBtn" disabled>切換前／後鏡頭</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
let model = null, stream = null, running = false, facing = 'environment', raf = 0;
let roi = { x:0.15, y:0.45, w:0.7, h:0.4 };     // 正規化座標 (0~1)
let state = 0, hit = 0, miss = 0, mq = null, lastBeat = 0;

/* ---------- MQTT ---------- */
function mqttConnect(){
  if (mq) return;
  mq = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', { clientId:'gate_phone_' + Math.random().toString(16).slice(2, 10), reconnectPeriod:2000 });
  mq.on('connect', () => { $('mq').textContent = 'MQTT：已連線 broker.hivemq.com'; send(state); });
  mq.on('reconnect', () => $('mq').textContent = 'MQTT：重新連線中…');
  mq.on('error', e => $('mq').textContent = 'MQTT 錯誤：' + e.message);
}
function send(v){
  if (mq && mq.connected) mq.publish($('topic').value.trim(), String(v), { retain:true, qos:1 });
}

/* ---------- 指定區域 (拖曳設定) ---------- */
let drag = null;
function pt(e){ const r = canvas.getBoundingClientRect(); return { x:Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y:Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; }
canvas.addEventListener('pointerdown', e => { drag = pt(e); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = pt(e);
  roi = { x:Math.min(drag.x, p.x), y:Math.min(drag.y, p.y), w:Math.abs(p.x - drag.x), h:Math.abs(p.y - drag.y) };
});
canvas.addEventListener('pointerup', () => { drag = null; if (roi.w < 0.05 || roi.h < 0.05) roi = { x:0.15, y:0.45, w:0.7, h:0.4 }; });

/* ---------- 相機與模型 ---------- */
async function loadModel(){
  try { await tf.ready(); model = await cocoSsd.load({ base:'lite_mobilenet_v2' }); $('status').textContent = '模型已就緒，請按「啟動」。'; $('startBtn').disabled = false; }
  catch (e) { $('status').textContent = '模型載入失敗：' + e.message; }
}
async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } } });
  video.srcObject = stream; await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  $('stage').style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
}
async function start(){
  if (!model || running) return;
  try {
    await openCamera(); running = true; mqttConnect();
    $('startBtn').disabled = true; $('stopBtn').disabled = $('flipBtn').disabled = false;
    $('status').textContent = '辨識中…'; loop();
  } catch (e) { $('status').textContent = '無法開啟相機：' + e.message; }
}
function stop(){
  running = false; cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null; ctx.clearRect(0, 0, canvas.width, canvas.height);
  setState(0); $('startBtn').disabled = false; $('stopBtn').disabled = $('flipBtn').disabled = true;
  $('status').textContent = '已停止。';
}
async function flip(){ facing = facing === 'environment' ? 'user' : 'environment'; if (running) try { await openCamera(); } catch (e) {} }

/* ---------- 判斷 ---------- */
function setState(v){
  if (v !== state) { state = v; send(v); lastBeat = Date.now(); }
  $('gate').className = state ? 'on' : '';
  $('gate').textContent = state ? '區域內汽車：是　→　發布 1（柵欄升起）' : '區域內汽車：否　→　發布 0（柵欄下降）';
}
async function loop(){
  if (!running) return;
  if (video.readyState >= 2) {
    const min = $('th').value / 100;
    const cars = (await model.detect(video, 20)).filter(p => p.class === 'car' && p.score >= min);
    const W = canvas.width, H = canvas.height, R = { x:roi.x*W, y:roi.y*H, w:roi.w*W, h:roi.h*H };
    const inside = cars.filter(p => { const cx = p.bbox[0] + p.bbox[2]/2, cy = p.bbox[1] + p.bbox[3]/2; return cx >= R.x && cx <= R.x+R.w && cy >= R.y && cy <= R.y+R.h; });
    if (inside.length) { hit++; miss = 0; } else { miss++; hit = 0; }
    if (hit >= 3) setState(1);            // 連續 3 幀有車 → 1
    if (miss >= 10) setState(0);          // 連續 10 幀沒車 → 0
    if (Date.now() - lastBeat > 3000) { send(state); lastBeat = Date.now(); }   // 心跳，讓 PC 保持同步
    draw(cars, inside, R);
  }
  raf = requestAnimationFrame(loop);
}
function draw(cars, inside, R){
  const W = canvas.width, fs = Math.max(14, Math.round(W / 32));
  ctx.clearRect(0, 0, W, canvas.height);
  ctx.lineWidth = Math.max(2, fs / 6); ctx.font = `600 ${fs}px system-ui, sans-serif`; ctx.textBaseline = 'top';
  ctx.setLineDash([12, 8]); ctx.strokeStyle = '#ffb020'; ctx.strokeRect(R.x, R.y, R.w, R.h); ctx.setLineDash([]);
  ctx.fillStyle = '#ffb020'; ctx.fillText('指定區域', R.x + 4, R.y + 4);
  for (const p of cars) {
    const [x, y, w, h] = p.bbox, on = inside.includes(p), c = on ? '#3ddc97' : '#7aa7ff';
    ctx.strokeStyle = c; ctx.strokeRect(x, y, w, h);
    const label = `汽車 car ${Math.round(p.score * 100)}%`, tw = ctx.measureText(label).width + 10;
    ctx.fillStyle = c; ctx.fillRect(x, Math.max(0, y - fs - 8), tw, fs + 8);
    ctx.fillStyle = '#000'; ctx.fillText(label, x + 5, Math.max(0, y - fs - 8) + 4);
  }
}

$('th').oninput = e => $('thVal').textContent = e.target.value;
$('startBtn').onclick = start; $('stopBtn').onclick = stop; $('flipBtn').onclick = flip;
loadModel();
</script>
</body>
</html>
