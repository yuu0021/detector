<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>手機 AI 即時物件識別 (COCO-SSD)</title>
<style>
  :root { --bg:#10151a; --panel:#1a222a; --ink:#eef3f6; --dim:#8fa1ad; --acc:#3ddc97; --warn:#ff6b5e; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  body { padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 12px); max-width:720px; margin:0 auto; }
  h1 { font-size:1.1rem; margin:14px 0 8px; }
  #status { color:var(--dim); font-size:.9rem; margin-bottom:8px; min-height:1.3em; }
  #stage { position:relative; width:100%; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:3/4; }
  #video, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #video { object-fit:fill; }
  #count { margin:10px 0; font-size:1rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  button { flex:1 1 40%; padding:12px; font-size:1rem; border:0; border-radius:8px; background:var(--panel); color:var(--ink); }
  button.primary { background:var(--acc); color:#06241a; font-weight:600; }
  button:disabled { opacity:.4; }
  button:focus-visible, input:focus-visible { outline:3px solid var(--acc); outline-offset:2px; }
  label { display:block; font-size:.95rem; margin:6px 0; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  #list { font-size:.9rem; color:var(--dim); }
</style>
</head>
<body>
<h1>手機 AI 即時物件識別（COCO-SSD）</h1>
<div id="status">正在載入 AI 模型…</div>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
</div>

<div id="count">偵測到 0 個物件</div>
<div id="list"></div>

<label>最低信心分數：<b id="thVal">50</b>%
  <input type="range" id="th" min="10" max="95" step="5" value="50">
</label>

<div class="row">
  <button id="startBtn" class="primary" disabled>啟動</button>
  <button id="stopBtn" disabled>停止</button>
  <button id="restartBtn" disabled>重新辨識</button>
  <button id="flipBtn" disabled>切換前／後鏡頭</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const ZH = {"person":"人","bicycle":"腳踏車","car":"汽車","motorcycle":"機車","airplane":"飛機","bus":"公車","train":"火車","truck":"卡車","boat":"船","traffic light":"紅綠燈","fire hydrant":"消防栓","stop sign":"停止標誌","parking meter":"停車計時器","bench":"長椅","bird":"鳥","cat":"貓","dog":"狗","horse":"馬","sheep":"羊","cow":"牛","elephant":"大象","bear":"熊","zebra":"斑馬","giraffe":"長頸鹿","backpack":"背包","umbrella":"雨傘","handbag":"手提包","tie":"領帶","suitcase":"行李箱","frisbee":"飛盤","skis":"滑雪板","snowboard":"單板滑雪板","sports ball":"球","kite":"風箏","baseball bat":"棒球棒","baseball glove":"棒球手套","skateboard":"滑板","surfboard":"衝浪板","tennis racket":"網球拍","bottle":"瓶子","wine glass":"酒杯","cup":"杯子","fork":"叉子","knife":"刀子","spoon":"湯匙","bowl":"碗","banana":"香蕉","apple":"蘋果","sandwich":"三明治","orange":"柳橙","broccoli":"花椰菜","carrot":"紅蘿蔔","hot dog":"熱狗","pizza":"披薩","donut":"甜甜圈","cake":"蛋糕","chair":"椅子","couch":"沙發","potted plant":"盆栽","bed":"床","dining table":"餐桌","toilet":"馬桶","tv":"電視","laptop":"筆電","mouse":"滑鼠","remote":"遙控器","keyboard":"鍵盤","cell phone":"手機","microwave":"微波爐","oven":"烤箱","toaster":"烤麵包機","sink":"水槽","refrigerator":"冰箱","book":"書","clock":"時鐘","vase":"花瓶","scissors":"剪刀","teddy bear":"泰迪熊","hair drier":"吹風機","toothbrush":"牙刷"};

const $ = id => document.getElementById(id);
const video = $('video'), canvas = $('overlay'), ctx = canvas.getContext('2d');
let model = null, stream = null, running = false, facing = 'environment', raf = 0;

function setStatus(t){ $('status').textContent = t; }
function colorFor(name){ let h = 0; for (const c of name) h = (h*31 + c.charCodeAt(0)) % 360; return `hsl(${h} 90% 55%)`; }

async function loadModel(){
  try {
    await tf.ready();
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    setStatus('模型已就緒，請按「啟動」。');
    $('startBtn').disabled = false;
  } catch (e) { setStatus('模型載入失敗：' + e.message); }
}

async function openCamera(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{ facingMode:{ ideal:facing }, width:{ ideal:640 }, height:{ ideal:480 } }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  $('stage').style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
}

async function start(){
  if (!model || running) return;
  try {
    setStatus('正在開啟相機…');
    await openCamera();
    running = true;
    $('startBtn').disabled = true;
    $('stopBtn').disabled = $('restartBtn').disabled = $('flipBtn').disabled = false;
    setStatus('辨識中…');
    loop();
  } catch (e) {
    setStatus('無法開啟相機：' + e.message + '（需使用 HTTPS 或 localhost，並允許相機權限）');
  }
}

function stop(){
  running = false; cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $('startBtn').disabled = false;
  $('stopBtn').disabled = $('restartBtn').disabled = $('flipBtn').disabled = true;
  $('count').textContent = '偵測到 0 個物件'; $('list').textContent = '';
  setStatus('已停止。');
}

async function restart(){ stop(); await start(); }

async function flip(){
  facing = facing === 'environment' ? 'user' : 'environment';
  if (running) { try { await openCamera(); } catch (e) { setStatus('切換失敗：' + e.message); } }
}

async function loop(){
  if (!running) return;
  if (video.readyState >= 2) {
    const min = $('th').value / 100;
    const preds = (await model.detect(video, 30)).filter(p => p.score >= min);
    draw(preds);
  }
  raf = requestAnimationFrame(loop);
}

function draw(preds){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const fs = Math.max(14, Math.round(canvas.width / 32));
  ctx.font = `600 ${fs}px system-ui, "Noto Sans TC", sans-serif`;
  ctx.textBaseline = 'top'; ctx.lineWidth = Math.max(2, fs / 6);
  const tally = {};
  for (const p of preds) {
    const [x, y, w, h] = p.bbox, c = colorFor(p.class);
    const label = `${ZH[p.class] || p.class} ${p.class} ${Math.round(p.score * 100)}%`;
    ctx.strokeStyle = c; ctx.strokeRect(x, y, w, h);
    const tw = ctx.measureText(label).width + 10, th = fs + 8;
    const ty = y - th >= 0 ? y - th : y;
    ctx.fillStyle = c; ctx.fillRect(x, ty, tw, th);
    ctx.fillStyle = '#000'; ctx.fillText(label, x + 5, ty + 4);
    tally[ZH[p.class] || p.class] = (tally[ZH[p.class] || p.class] || 0) + 1;
  }
  $('count').textContent = `偵測到 ${preds.length} 個物件`;
  $('list').textContent = Object.entries(tally).map(([k, v]) => `${k} × ${v}`).join('　');
}

$('th').addEventListener('input', e => { $('thVal').textContent = e.target.value; });
$('startBtn').onclick = start; $('stopBtn').onclick = stop;
$('restartBtn').onclick = restart; $('flipBtn').onclick = flip;
loadModel();
</script>
</body>
</html>
